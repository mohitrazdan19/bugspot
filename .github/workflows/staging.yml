# Publishes the staging site (https://staging.quizzifytech.com).
# This file lives in both repos, but the job only runs in the staging repo
# (mohitrazdan19/quizzifytech-staging). The live repo keeps publishing from its
# branch as before. See README "Staging site".
name: Staging site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: staging-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'mohitrazdan19/quizzifytech-staging'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/make-staging.mjs _staging
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _staging
      - id: deploy
        uses: actions/deploy-pages@v4
