<!doctype html><html><head><meta charset=utf8><title>Bugspot: Daily Spot the Bug Game for QA Testers</title><meta name="description" content="A free daily bug puzzle for QA testers. Spot the bug on a fake app screen in three tries, then read the bug report."><meta property="og:title" content="Bugspot: Daily Spot the Bug Game for QA Testers"><meta property="og:description" content="One screen. One bug. Three tries. Can you spot it?"><meta property="og:type" content="website"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout concept: a tester's desk. A quiet bug-tracker chrome (ticket strip, mono ids,
     severity pills) around one loud object, the phone showing the app under test.
     Bug red is used only for bugs: brand mark, tries, found highlight. */
  :root {
    color-scheme: light;
    --bg: #eceff6;
    --surface: #ffffff;
    --raise: #f4f6fb;
    --ink: #101729;
    --dim: #566078;
    --line: #d7dce8;
    --bug: #d6283a;
    --ok: #0f7d58;
    --ok-soft: #dcf4ea;
    --focus: #2b59ff;
    --p1: #d6283a; --p2: #c4640a; --p3: #2f64e0; --p4: #5d667c;
    --on-sev: #ffffff;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1222; --surface: #161d33; --raise: #1d2642; --ink: #eef1fb; --dim: #9ba5c2; --line: #2b3554;
      --bug: #ff6673; --ok: #4fd7a6; --ok-soft: #14352c; --focus: #8aa4ff;
      --p1: #ff6673; --p2: #ffa14a; --p3: #7ea6ff; --p4: #9aa4ba; --on-sev: #140c12;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1222; --surface: #161d33; --raise: #1d2642; --ink: #eef1fb; --dim: #9ba5c2; --line: #2b3554;
    --bug: #ff6673; --ok: #4fd7a6; --ok-soft: #14352c; --focus: #8aa4ff;
    --p1: #ff6673; --p2: #ffa14a; --p3: #7ea6ff; --p4: #9aa4ba; --on-sev: #140c12;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 16px/1.5 var(--body);
    padding-block: 12px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #app { max-width: 520px; margin: 0 auto; }
  h1, h2, p { margin: 0; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 8px; font: 800 27px/1 var(--display); letter-spacing: -0.4px; }
  .brand svg { width: 30px; height: 30px; color: var(--bug); flex: none; }
  .tabs { display: flex; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
  .tabs button { padding: 8px 14px; border-radius: 999px; font: 600 14px/1 var(--body); color: var(--dim); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .eyebrow { font: 500 12px/1.2 var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .hero h1 { font: 800 clamp(29px, 8.4vw, 38px)/1.04 var(--display); letter-spacing: -0.6px; text-wrap: balance; margin: 10px 0 10px; }
  .lede { color: var(--dim); max-width: 44ch; }
  .stack { display: grid; gap: 10px; }
  .btn-p { background: var(--ink); color: var(--bg); border-radius: 14px; min-height: 52px; padding: 0 20px; font: 700 17px/1 var(--display); width: 100%; }
  .btn-s { border: 1.5px solid var(--line); border-radius: 14px; min-height: 48px; padding: 0 18px; font: 600 16px/1 var(--body); width: 100%; background: var(--surface); }
  .meta { font: 500 13px/1.3 var(--mono); color: var(--dim); }
  .meta b { color: var(--ink); }
  .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .how div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; font-size: 13px; color: var(--dim); line-height: 1.35; }
  .how b { display: block; font: 600 12px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--ink); margin-bottom: 6px; }

  .sevpill { display: inline-block; font: 600 12px/1 var(--mono); padding: 5px 8px; border-radius: 6px; background: var(--p4); color: var(--on-sev); letter-spacing: 0.4px; }
  .sevpill[data-sev="P1"] { background: var(--p1); } .sevpill[data-sev="P2"] { background: var(--p2); }
  .sevpill[data-sev="P3"] { background: var(--p3); } .sevpill[data-sev="P4"] { background: var(--p4); }
  .sqs { display: flex; gap: 6px; margin: 4px 0 2px; }
  .sq { width: 26px; height: 26px; border-radius: 7px; background: var(--bug); }
  .sq.g { background: var(--ok); }
  .res { font: 800 30px/1.05 var(--display); letter-spacing: -0.4px; margin: 8px 0 4px; text-wrap: balance; }
  .rt { color: var(--dim); font-size: 15px; }

  .sumrow { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 10px; }
  .sumrow h2 { font: 700 18px/1.2 var(--display); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 4px; align-content: start; min-height: 98px; }
  .tile .n { font: 500 12px/1 var(--mono); color: var(--dim); }
  .tile .a { font: 700 15px/1.2 var(--display); }
  .tile .d { font-size: 12px; color: var(--dim); }
  .tile .st { font-size: 15px; letter-spacing: 2px; color: var(--p2); margin-top: 2px; }
  .tile .st i { font-style: normal; color: var(--line); }
  .tile.done { background: var(--raise); }

  .playbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .link { font: 600 15px/1 var(--body); color: var(--ink); padding: 10px 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  .ptitle { font: 700 17px/1.2 var(--display); text-align: center; }
  .tries { display: flex; gap: 3px; }
  .tries svg { width: 26px; height: 26px; color: var(--bug); }
  .tries svg.off { color: var(--line); }
  .ticket { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; font-size: 14px; }
  .tid { font: 600 12px/1 var(--mono); background: var(--raise); padding: 5px 7px; border-radius: 6px; }
  .ticket .grow { flex: 1 1 160px; min-width: 0; }

  .phone { width: min(100%, 346px); margin: 14px auto 0; background: #0a0e18; border-radius: 40px; padding: 10px; position: relative; box-shadow: 0 18px 40px rgba(10, 16, 40, 0.28); }
  .phone.shake { animation: shake 0.32s; }
  @keyframes shake { 20% { transform: translateX(-6px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } 100% { transform: none; } }
  .screen { position: relative; overflow: hidden; background: #fff; color: #1b2030; border-radius: 31px; min-height: 440px; cursor: crosshair;
    font: 400 14px/1.4 Roboto, 'Segoe UI', system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .screen::before { content: ""; position: absolute; top: 8px; left: 50%; width: 74px; height: 6px; margin-left: -37px; border-radius: 3px; background: #0a0e18; opacity: 0.9; }
  .screen *, .screen *::before, .screen *::after { box-sizing: border-box; }
  .sb { display: flex; justify-content: space-between; padding: 22px 22px 4px; font-size: 12px; font-weight: 600; }
  .ab { display: flex; align-items: center; gap: 10px; padding: 8px 18px; font-size: 18px; font-weight: 700; }
  .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; background: var(--ac); flex: none; }
  .pad { padding: 6px 18px 22px; display: grid; gap: 12px; }
  .card2, .screen .card { border: 1px solid #e6e9f0; border-radius: 14px; padding: 4px 14px; background: #fff; }
  .screen .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eef0f5; }
  .screen .row:last-child { border-bottom: 0; }
  .screen .m { color: #6a7285; } .screen .s { font-size: 12px; } .screen .b { font-weight: 700; }
  .screen .btn { background: var(--ac); color: #fff; text-align: center; border-radius: 12px; padding: 12px; font-weight: 700; }
  .screen .btn.o { background: #fff; color: var(--ac); border: 1.5px solid var(--ac); }
  .screen .fld { border: 1.5px solid #d3d8e3; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; background: #fff; gap: 8px; }
  .screen .fl { font-size: 12px; color: #6a7285; margin: 0 0 4px 2px; }
  .screen .tick { color: #12935f; font-weight: 600; }
  .screen .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #e9f6ee; color: #0e7a4c; font-size: 12px; font-weight: 600; }
  .screen .bar { height: 9px; border-radius: 5px; background: #e7e9f0; overflow: hidden; }
  .screen .bar i { display: block; height: 100%; background: var(--ac); }
  .screen .tab { display: flex; justify-content: space-around; border-top: 1px solid #eceef4; padding: 12px 0; font-size: 12px; color: #6a7285; margin-top: 6px; }
  .screen span[data-bug] { display: inline-block; padding: 12px 10px; margin: -12px -10px; }
  .screen .ab span[data-bug] { margin-right: 0; }
  .screen .hi { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .screen i.dotp { width: 26px; height: 6px; border-radius: 3px; background: #e1e4ec; display: block; }
  .screen i.dotp.on { background: var(--ac); }
  .screen .tl { display: flex; gap: 12px; align-items: center; padding: 9px 0; }
  .screen .tl i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 13px; flex: none; }
  .screen .tl i.dn { background: #16a34a; color: #fff; }
  .screen .tl i.pn { border: 2px solid #c8ccd8; background: #fff; }
  .screen .img { height: 140px; border-radius: 14px; background: linear-gradient(135deg, var(--ac), #f6c7b9); opacity: 0.88; }

  .screen [data-bug].found { outline: 3px solid #e5303f; outline-offset: 3px; border-radius: 10px; box-shadow: 0 0 0 8px rgba(229, 48, 63, 0.18); animation: ring 1.1s ease-in-out infinite; }
  @keyframes ring { 50% { box-shadow: 0 0 0 12px rgba(229, 48, 63, 0.06); } }
  .miss { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%; border: 2px solid #e5303f; color: #e5303f; background: rgba(255, 255, 255, 0.88);
    display: grid; place-items: center; font: 700 15px/1 system-ui, sans-serif; pointer-events: none; animation: missfade 0.8s forwards; z-index: 5; }
  @keyframes missfade { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }

  .after { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 82vh; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--line);
    border-radius: 24px 24px 0 0; box-shadow: 0 -24px 60px rgba(8, 12, 30, 0.35);
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    transform: translateY(105%); transition: transform 0.36s cubic-bezier(0.2, 0.9, 0.25, 1); }
  .sheet.show { transform: none; }
  .sheet-in { max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
  .shtop { display: flex; align-items: center; gap: 10px; }
  .shtop .mono { font: 500 13px/1 var(--mono); color: var(--dim); flex: 1; }
  .x { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); font-size: 16px; line-height: 1; }
  .status { font: 600 13px/1.3 var(--mono); }
  .status.ok { color: var(--ok); } .status.no { color: var(--bug); }
  .sheet h2 { font: 800 24px/1.15 var(--display); letter-spacing: -0.3px; text-wrap: balance; }
  .rep { display: grid; gap: 12px; font-size: 15px; }
  .rep h3 { margin: 0 0 4px; font: 600 12px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
  .rep ol { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
  .ea { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ea > div { background: var(--raise); border-radius: 12px; padding: 10px 12px; }
  .ea p { font-size: 14px; line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
  .tip { background: var(--ok-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .tip b { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 4px; color: var(--ok); }
  .btns { display: grid; gap: 10px; }
  .sharebox { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--raise); font: 500 14px/1.5 var(--mono); white-space: pre-wrap; -webkit-user-select: text; user-select: text; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 380px) { .ea { grid-template-columns: 1fr; } .brand { font-size: 23px; } }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } .phone.shake, .screen [data-bug].found { animation: none; } }
</style>

<div id="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.2c-2.6 0-4.4 1.9-4.4 4.6S9.4 19 12 19s4.4-3.6 4.4-6.2S14.6 8.2 12 8.2Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M12 8.2V19M9.3 6.4a2.7 2.7 0 0 1 5.4 0M7.6 12.3 4 10.6M16.4 12.3 20 10.6M8 16.4l-3.4 1.6M16 16.4l3.4 1.6"/></svg>Bugspot</div>
    <nav class="tabs" aria-label="Mode">
      <button id="tabDaily" type="button" aria-selected="true">Daily</button>
      <button id="tabPractice" type="button" aria-selected="false">Practice</button>
    </nav>
  </header>
  <main id="view"></main>

  <div id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="shT" hidden>
    <div class="sheet-in">
      <div class="shtop"><span id="shSev" class="sevpill">P3</span><span id="shId" class="mono"></span><button id="shClose" class="x" type="button" aria-label="Close report">✕</button></div>
      <p id="shStatus" class="status"></p>
      <h2 id="shT"></h2>
      <div id="shBody" class="rep"></div>
      <pre id="shShare" class="sharebox" hidden></pre>
      <div id="shBtns" class="btns"></div>
    </div>
  </div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>

<script>
// Each puzzle is a fake app screen with exactly one planted bug.
// The planted bug is whatever element carries the data-bug attribute.
const SB = '<div class="sb"><span>9:41</span><span>5G ▂▄▆ 82%</span></div>';

const PUZZLES = [
  {
    id: 'greeting', area: 'Home', sev: 'P3', diff: 'Easy', ac: '#c25b1f',
    hint: 'Start at the top and read every word.',
    html: SB + `
<div class="ab"><span class="logo">C</span>ChaiBox</div>
<div class="pad">
  <div><div class="hi" data-bug>Welcome back, undefined 👋</div><div class="m s" style="margin-top:4px">Your next box ships on Friday</div></div>
  <div class="card">
    <div class="row"><div><div class="b">Masala Classic</div><div class="m s">Delivery · 25 Oct</div></div><span class="chip">Active</span></div>
    <div class="row"><div><div class="b">Ginger Boost</div><div class="m s">Delivery · paused</div></div><span class="m s">Paused</span></div>
  </div>
  <div class="btn">Skip next delivery</div>
  <div class="btn o">Manage subscription</div>
</div>
<div class="tab"><span>Home</span><span>Orders</span><span>Account</span></div>`,
    rep: {
      title: 'Greeting shows “undefined” instead of the customer’s name',
      steps: ['Sign in with an account that has no first name saved', 'Open the Home tab'],
      expected: 'Welcome back, Riya (or a plain “Welcome back” if the name is missing)',
      actual: 'Welcome back, undefined',
      tip: 'Raw words like undefined, null and NaN leak onto screens when data is missing. Always test accounts with empty profiles.',
    },
  },
  {
    id: 'cta-typo', area: 'Sign in', sev: 'P4', diff: 'Easy', ac: '#2563eb',
    hint: 'Read the words on the buttons.',
    html: SB + `
<div class="ab"><span class="logo">P</span>PayWise</div>
<div class="pad">
  <div class="hi">Sign in to continue</div>
  <div><div class="fl">Email</div><div class="fld">riya.sharma@mail.com</div></div>
  <div><div class="fl">Password</div><div class="fld"><span>••••••••••</span><span class="m s">Show</span></div></div>
  <div class="btn" data-bug>Sing in</div>
  <div class="s" style="text-align:center;color:var(--ac);font-weight:600">Forgot password?</div>
  <div class="s m" style="text-align:center">New here? Create an account</div>
</div>`,
    rep: {
      title: 'Typo on the main button: “Sing in”',
      steps: ['Open the app while signed out', 'Read the primary button on the sign-in screen'],
      expected: 'Sign in',
      actual: 'Sing in',
      tip: 'Every user sees the primary button. Proofread visible text as carefully as code, and check translated versions too.',
    },
  },
  {
    id: 'pagination', area: 'Search', sev: 'P3', diff: 'Easy', ac: '#0f9d8a',
    hint: 'Check the numbers at the bottom of the list.',
    html: SB + `
<div class="ab"><span class="logo">S</span>ShopNest</div>
<div class="pad">
  <div class="fld"><span>earbuds</span><span class="m s">Clear</span></div>
  <div class="card">
    <div class="row"><span>Wireless earbuds Pro</span><span class="b">₹1,499</span></div>
    <div class="row"><span>Earbuds case, silicone</span><span class="b">₹199</span></div>
    <div class="row"><span>Earbuds with mic</span><span class="b">₹799</span></div>
    <div class="row"><span>Sport earbuds, red</span><span class="b">₹999</span></div>
  </div>
  <div data-bug class="s m" style="text-align:center;padding:12px 6px">Showing 21–20 of 45 results</div>
  <div style="display:flex;gap:10px"><div class="btn o" style="flex:1">‹ Prev</div><div class="btn" style="flex:1">Next ›</div></div>
</div>`,
    rep: {
      title: 'Result range reads “21–20 of 45”',
      steps: ['Search for “earbuds”', 'Go to page 3 of the results'],
      expected: 'Showing 21–30 of 45 results',
      actual: 'Showing 21–20 of 45 results',
      tip: 'Counts and ranges break at boundaries. Test the first page, the last page, and a page with fewer items than the page size.',
    },
  },
  {
    id: 'cart-total', area: 'Cart', sev: 'P1', diff: 'Medium', ac: '#16a34a',
    hint: 'Do the sums yourself.',
    html: SB + `
<div class="ab"><span class="logo">G</span>GreenGrocer · Cart</div>
<div class="pad">
  <div class="card">
    <div class="row"><div><div class="b">Basmati rice</div><div class="m s">5 kg</div></div><span>₹620</span></div>
    <div class="row"><div><div class="b">Toor dal</div><div class="m s">1 kg</div></div><span>₹165</span></div>
    <div class="row"><div><div class="b">Cow ghee</div><div class="m s">500 ml</div></div><span>₹340</span></div>
  </div>
  <div class="card">
    <div class="row"><span class="m">Subtotal</span><span>₹1,125</span></div>
    <div class="row"><span class="m">Delivery</span><span>₹40</span></div>
    <div class="row" data-bug><span class="b">Total</span><span class="b">₹1,065</span></div>
  </div>
  <div class="btn">Place order</div>
</div>`,
    rep: {
      title: 'Order total is ₹100 lower than the items plus delivery',
      steps: ['Add rice, dal and ghee to the cart', 'Open the cart and compare the totals'],
      expected: '₹1,165 (₹1,125 + ₹40)',
      actual: '₹1,065',
      tip: 'Money bugs are always high severity. Add the numbers up yourself, every time.',
    },
  },
  {
    id: 'password-plain', area: 'Sign up', sev: 'P1', diff: 'Medium', ac: '#6d28d9',
    hint: 'Compare the two password fields.',

'use strict';
// Bugspot game layer. Uses PUZZLES declared above it.

const $ = id => document.getElementById(id);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const p2 = n => String(n).padStart(2, '0');
const dayKey = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const dayLabel = d => d.getDate() + ' ' + MONTHS[d.getMonth()];
const dayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const dailyIdx = d => (dayNum(d) * 7 + 3) % PUZZLES.length;
const fmtT = ms => { const s = Math.max(1, Math.round(ms / 1000)); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + p2(s % 60) + 's'; };
const SEV = { P1: 'Critical', P2: 'Major', P3: 'Minor', P4: 'Cosmetic' };
const BUG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8.2c-2.6 0-4.4 1.9-4.4 4.6S9.4 19 12 19s4.4-3.6 4.4-6.2S14.6 8.2 12 8.2Z"/><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M12 8.2V19M9.3 6.4a2.7 2.7 0 0 1 5.4 0M7.6 12.3 4 10.6M16.4 12.3 20 10.6M8 16.4l-3.4 1.6M16 16.4l3.4 1.6"/></svg>';

// ---------- saved progress (per browser, optional) ----------
const KEY = 'bugspot.v1';
const save = { stars: {}, daily: null, streak: 0, last: '', pending: null };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) {
    const s = JSON.parse(raw);
    if (s && typeof s === 'object') {
      if (s.stars && typeof s.stars === 'object') save.stars = s.stars;
      if (s.daily && typeof s.daily === 'object') save.daily = s.daily;
      if (typeof s.streak === 'number') save.streak = s.streak;
      if (typeof s.last === 'string') save.last = s.last;
      if (s.pending && typeof s.pending === 'object') save.pending = s.pending;
    }
  }
} catch (e) { /* storage unavailable */ }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }

// ---------- state ----------
const S = { view: 'daily', idx: 0, from: 'daily', used: 0, hint: false, t0: 0, done: false, found: false, tickTimer: 0 };

// Streak shown to the player: only counts if the last finished daily was today or yesterday.
function liveStreak() {
  const t = new Date(), y = new Date(t.getFullYear(), t.getMonth(), t.getDate() - 1);
  return save.last === dayKey(t) || save.last === dayKey(y) ? save.streak : 0;
}
function say(t) { $('live').textContent = t; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function setView(v) {
  clearInterval(S.tickTimer);
  S.view = v;
  closeSheet();
  const play = v === 'play';
  $('tabDaily').setAttribute('aria-selected', String(S.from === 'daily' && (v === 'daily' || play)));
  $('tabPractice').setAttribute('aria-selected', String(S.from === 'practice' && (v === 'practice' || play)));
  if (v === 'daily') renderDaily();
  else if (v === 'practice') renderPractice();
  else renderPlay();
  window.scrollTo(0, 0);
}

// ---------- daily ----------
function nextBugIn() {
  const n = new Date();
  const next = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1);
  const m = Math.max(1, Math.round((next - n) / 60000));
  return Math.floor(m / 60) + 'h ' + p2(m % 60) + 'm';
}

function renderDaily() {
  S.from = 'daily';
  $('tabDaily').setAttribute('aria-selected', 'true');
  $('tabPractice').setAttribute('aria-selected', 'false');
  const today = new Date(), key = dayKey(today), d = save.daily;
  const v = $('view');
  if (!d || d.key !== key) {
    v.innerHTML =
      '<section class="card hero"><p class="eyebrow">Daily bug · ' + dayLabel(today) + '</p>' +
      '<h1>One screen. One bug. Three tries.</h1>' +
      '<p class="lede">A made-up app has a defect hiding in plain sight. Tap it before your tries run out, then read the bug report.</p>' +
      '<div class="stack" style="margin-top:18px"><button id="go" class="btn-p" type="button">Start today’s hunt</button>' +
      '<p class="meta">Streak <b>' + liveStreak() + '</b> ' + (liveStreak() === 1 ? 'day' : 'days') + '</p></div></section>' +
      '<div class="how"><div><b>Tap</b>the one thing that is wrong</div><div><b>Read</b>a short QA bug report</div><div><b>Share</b>your result with your team</div></div>';
    $('go').addEventListener('click', () => startPlay(dailyIdx(today), 'daily'));
    return;
  }
  const p = PUZZLES[d.idx];
  const sq = d.found ? '<i class="sq"></i>'.repeat(d.tries - 1) + '<i class="sq g"></i>' : '<i class="sq"></i><i class="sq"></i><i class="sq"></i>';
  v.innerHTML =
    '<section class="card hero"><p class="eyebrow">Daily bug · ' + dayLabel(today) + '</p>' +
    '<div class="sqs" role="img" aria-label="Your tries">' + sq + '</div>' +
    '<p class="res">' + (d.found ? 'Found it in ' + d.tries + (d.tries === 1 ? ' try' : ' tries') : 'Today’s bug got away') + '</p>' +
    '<p class="rt">' + (d.found ? fmtT(d.time) + ' · ' : '') + '<span class="sevpill" data-sev="' + p.sev + '">' + p.sev + ' ' + SEV[p.sev] + '</span></p>' +
    '<p style="margin-top:12px"><b>' + esc(p.rep.title) + '</b></p>' +
    '<div class="stack" style="margin-top:16px"><button id="shareBtn" class="btn-p" type="button">Share result</button>' +
    '<button id="repBtn" class="btn-s" type="button">Read the bug report</button></div>' +
    '<p class="meta" style="margin-top:14px">Next bug in <b id="cd">' + nextBugIn() + '</b> · Streak <b>' + liveStreak() + '</b> ' + (liveStreak() === 1 ? 'day' : 'days') + '</p></section>' +
    '<div class="stack" style="margin-top:12px"><button id="morePrac" class="btn-s" type="button">Practise with ' + (PUZZLES.length - 1) + ' more bugs</button></div>';
  $('shareBtn').addEventListener('click', () => showShare());
  $('repBtn').addEventListener('click', () => showReport(d.idx, d.found, d.tries, d.time, 'daily'));
  $('morePrac').addEventListener('click', () => { S.from = 'practice'; setView('practice'); });
  S.tickTimer = setInterval(() => { const c = $('cd'); if (c) c.textContent = nextBugIn(); }, 30000);
}

function shareText() {
  const d = save.daily, p = PUZZLES[d.idx];
  const sq = d.found ? '🟥'.repeat(d.tries - 1) + '🟩' : '🟥🟥🟥';
  const pd = d.key.split('-').map(Number);
  return 'Bugspot Daily · ' + dayLabel(new Date(pd[0], pd[1] - 1, pd[2])) + '\n' + sq + ' ' +
    (d.found ? 'found in ' + d.tries + (d.tries === 1 ? ' try' : ' tries') + ' · ' + fmtT(d.time) : 'the bug got away') +
    '\nSeverity ' + p.sev + ' (' + SEV[p.sev] + ')\nCan you spot it?';
}

function copyText(text, btn) {
  const pre = $('shShare');
  const fallback = () => {
    try { const r = document.createRange(); r.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* ignore */ }
    btn.textContent = 'Select the text above and copy';
  };
  try { navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Copied'; }, fallback); } catch (e) { fallback(); }
}

function showShare() {
  const text = shareText();
  openSheet({
    sev: null, id: 'Daily result', status: '', title: 'Share your result',
    body: '', share: text,
    buttons: [
      { label: 'Copy result', primary: true, fn: btn => copyText(text, btn) },
      { label: 'Close', fn: closeSheet },
    ],
  });
}

// ---------- practice ----------
function stars(n) { return '★'.repeat(n) + '<i>' + '★'.repeat(3 - n) + '</i>'; }
function renderPractice() {
  S.from = 'practice';
  $('tabDaily').setAttribute('aria-selected', 'false');
  $('tabPractice').setAttribute('aria-selected', 'true');
  let total = 0;
  PUZZLES.forEach(p => { total += save.stars[p.id] || 0; });
  const tiles = PUZZLES.map((p, i) => {
    const s = save.stars[p.id];
    return '<button class="tile' + (s !== undefined ? ' done' : '') + '" type="button" data-i="' + i + '" aria-label="Puzzle ' + (i + 1) + ', ' + p.area + ', ' + p.diff + (s !== undefined ? ', ' + s + ' stars' : '') + '">' +
      '<span class="n">#' + p2(i + 1) + '</span><span class="a">' + p.area + '</span><span class="d">' + p.diff + '</span>' +
      '<span class="st" aria-hidden="true">' + stars(s || 0) + '</span></button>';
  }).join('');
  $('view').innerHTML =
    '<section class="card"><p class="eyebrow">Practice</p><h1 style="font:800 26px/1.1 var(--display);margin-top:8px">' + PUZZLES.length + ' bugs to hunt</h1>' +
    '<p class="lede" style="margin-top:6px">Find each bug in three tries or fewer. Fewer tries and no hint earn more stars.</p></section>' +
    '<div class="sumrow"><h2>All screens</h2><span class="meta"><b>' + total + '</b> / ' + PUZZLES.length * 3 + ' stars</span></div>' +
    '<div class="grid">' + tiles + '</div>';
  $('view').querySelectorAll('.tile').forEach(b => b.addEventListener('click', () => startPlay(+b.dataset.i, 'practice')));
}

// ---------- play ----------
function startPlay(idx, from) {
  S.idx = idx; S.from = from; S.used = 0; S.hint = false; S.done = false; S.found = false; S.t0 = performance.now();
  if (from === 'daily') {
    // Keep tries and hint across a refresh so the daily cannot be retried.
    const key = dayKey(new Date());
    if (save.pending && save.pending.key === key && save.pending.idx === idx) {
      S.used = Math.min(2, save.pending.used | 0); S.hint = !!save.pending.hint;
    } else { save.pending = { key, idx, used: 0, hint: false }; persist(); }
  }
  setView('play');
}

function triesHtml() {
  let h = '';
  for (let i = 0; i < 3; i++) h += BUG.replace('<svg ', '<svg class="' + (i < 3 - S.used ? 'on' : 'off') + '" ');
  return h;
}

function renderPlay() {
  const p = PUZZLES[S.idx];
  $('view').innerHTML =
    '<div class="playbar"><button id="back" class="link" type="button">‹ Back</button>' +
    '<div class="ptitle">' + p.area + ' · ' + (S.from === 'daily' ? 'Daily' : '#' + p2(S.idx + 1)) + '</div>' +
    '<div id="tries" class="tries" role="img" aria-label="3 tries left">' + triesHtml() + '</div></div>' +
    '<div class="ticket"><span class="tid">QA-' + (104 + S.idx) + '</span><span id="note" class="grow">Something on this screen is wrong. Tap it.</span><button id="hintBtn" class="link" type="button">Hint</button></div>' +
    '<div class="phone" id="phone"><div class="screen" id="screen" style="--ac:' + p.ac + '">' + p.html + '</div></div>' +
    '<div id="after" class="after" hidden></div>';
  $('back').addEventListener('click', () => setView(S.from === 'daily' ? 'daily' : 'practice'));
  $('hintBtn').addEventListener('click', () => {
    if (S.done || S.hint) return;
    S.hint = true;
    $('note').textContent = 'Hint: ' + p.hint;
    $('hintBtn').hidden = true;
    if (S.from === 'daily' && save.pending) { save.pending.hint = true; persist(); }
  });
  $('screen').addEventListener('click', onTap);
  if (S.hint) { $('note').textContent = 'Hint: ' + p.hint; $('hintBtn').hidden = true; }
  $('tries').setAttribute('aria-label', (3 - S.used) + ' tries left');
}

function onTap(e) {
  if (S.done) return;
  const hit = e.target.closest('[data-bug]');
  if (hit) { finish(true); return; }
  S.used++;
  const sc = $('screen'), r = sc.getBoundingClientRect();
  const m = document.createElement('div');
  m.className = 'miss'; m.textContent = '×';
  m.style.left = (e.clientX - r.left) + 'px'; m.style.top = (e.clientY - r.top) + 'px';
  sc.appendChild(m);
  setTimeout(() => m.remove(), 850);
  const ph = $('phone');
  ph.classList.remove('shake'); void ph.offsetWidth; ph.classList.add('shake');
  try { if (navigator.vibrate) navigator.vibrate(25); } catch (err) { /* ignore */ }
  $('tries').innerHTML = triesHtml();
  $('tries').setAttribute('aria-label', (3 - S.used) + ' tries left');
  say('Not it. ' + (3 - S.used) + ' tries left.');
  if (S.from === 'daily' && save.pending && S.used < 3) { save.pending.used = S.used; persist(); }
  if (S.used >= 3) finish(false);
}

function finish(found) {
  S.done = true; S.found = found;
  const time = performance.now() - S.t0;
  const p = PUZZLES[S.idx];
  const tries = found ? S.used + 1 : 3;
  document.querySelectorAll('#screen [data-bug]').forEach(el => el.classList.add('found'));
  let st = 0;
  if (found) { st = 4 - tries; if (S.hint) st = Math.max(1, st - 1); }
  if (found) save.stars[p.id] = Math.max(save.stars[p.id] || 0, st);
  if (S.from === 'daily') {
    const today = new Date(), key = dayKey(today);
    if (!save.daily || save.daily.key !== key) {
      const y = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
      // A missed daily ends the streak; a found one extends it.
      save.streak = found ? (save.last === dayKey(y) ? save.streak + 1 : 1) : 0;
      save.last = key;
      save.pending = null;
      save.daily = { key, idx: S.idx, found, tries, time };
    }
  }
  persist();
  say(found ? 'Found it. Bug report open.' : 'Out of tries. The bug is highlighted.');
  const after = $('after');
  after.hidden = false;
  const last = S.from === 'practice' && S.idx >= PUZZLES.length - 1;
  after.innerHTML = '<button id="aRep" class="btn-s" type="button">Bug report</button>' +
    (S.from === 'daily' ? '<button id="aNext" class="btn-p" type="button">Share result</button>' :
      '<button id="aNext" class="btn-p" type="button">' + (last ? 'All puzzles' : 'Next puzzle') + '</button>');
  $('aRep').addEventListener('click', () => showReport(S.idx, found, tries, time, S.from));
  $('aNext').addEventListener('click', () => {
    if (S.from === 'daily') showShare();
    else if (last) setView('practice');
    else startPlay(S.idx + 1, 'practice');
  });
  // On a miss, leave the highlighted bug visible; the player opens the report with the button.
  if (found) setTimeout(() => { if (S.view === 'play' && S.done) showReport(S.idx, found, tries, time, S.from); }, 750);
  else $('note').textContent = 'Out of tries. The bug is circled in red. Tap Bug report to read it.';
}

// ---------- bug report sheet ----------
function showReport(idx, found, tries, time, from) {
  const p = PUZZLES[idx], r = p.rep;
  const body =
    '<div><h3>Steps to reproduce</h3><ol>' + r.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol></div>' +
    '<div class="ea"><div><h3>Expected</h3><p>' + esc(r.expected) + '</p></div><div><h3>Actual</h3><p>' + esc(r.actual) + '</p></div></div>' +
    '<div class="tip"><b>Tester tip</b>' + esc(r.tip) + '</div>';
  const buttons = [];
  if (from === 'daily') buttons.push({ label: 'Share result', primary: true, fn: () => showShare() }, { label: 'Close', fn: closeSheet });
  else {
    const last = idx >= PUZZLES.length - 1;
    buttons.push({ label: last ? 'All puzzles' : 'Next puzzle', primary: true, fn: () => (last ? setView('practice') : startPlay(idx + 1, 'practice')) }, { label: 'Close', fn: closeSheet });
  }
  openSheet({
    sev: p.sev, id: 'BUG-' + (1000 + idx * 7),
    status: found ? 'Found in ' + tries + (tries === 1 ? ' try' : ' tries') + ' · ' + fmtT(time) : 'Not found this time',
    ok: found, title: r.title, body, buttons,
  });
}

function openSheet(o) {
  const sev = $('shSev');
  sev.hidden = !o.sev;
  if (o.sev) { sev.textContent = o.sev + ' ' + SEV[o.sev]; sev.setAttribute('data-sev', o.sev); }
  $('shId').textContent = o.id;
  const st = $('shStatus');
  st.textContent = o.status || '';
  st.hidden = !o.status;
  st.className = 'status ' + (o.ok ? 'ok' : 'no');
  $('shT').textContent = o.title;
  $('shBody').innerHTML = o.body || '';
  const pre = $('shShare');
  pre.hidden = !o.share;
  if (o.share) pre.textContent = o.share;
  const box = $('shBtns');
  box.textContent = '';
  for (const b of o.buttons) {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = b.primary ? 'btn-p' : 'btn-s';
    el.textContent = b.label;
    el.addEventListener('click', () => b.fn(el));
    box.appendChild(el);
  }
  const sh = $('sheet');
  sh.hidden = false;
  sh.scrollTop = 0;
  requestAnimationFrame(() => sh.classList.add('show'));
}
function closeSheet() { const sh = $('sheet'); sh.classList.remove('show'); sh.hidden = true; }

$('shClose').addEventListener('click', closeSheet);
$('tabDaily').addEventListener('click', () => { S.from = 'daily'; setView('daily'); });
$('tabPractice').addEventListener('click', () => { S.from = 'practice'; setView('practice'); });

setView('daily');

if (typeof __TEST__ !== 'undefined') __TEST__({ S, save, startPlay, setView, onTap, PUZZLES });

</script>
